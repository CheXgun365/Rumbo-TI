function load(){try{let r=localStorage.getItem(KEY);if(r)return JSON.parse(r);r=localStorage.getItem('lineas_carrera_v1');if(r){const o=JSON.parse(r),ids=o.map(x=>x.id);return o.concat(ALL.filter(x=>!ids.includes(x.id)))}}catch(e){}return JSON.parse(JSON.stringify(ALL))}

 const o={id:editing||'c'+Date.now(),n,i:$('e_i').value||'⭐',c:$('e_c').value.trim()||'General',s:$('e_s').value.trim(),p:$('e_p').value.trim(),

 t:$('e_t').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split('|').map(s=>s.trim());const lv=LV.find(v=>v.toLowerCase()===(p[1]||'').toLowerCase())||'Intermedio';return{n:p[0],l:lv,t:(p[2]||'').split(',').map(s=>s.trim()).filter(Boolean)}})};

let UP=[],view='c',gf='',PK=null;
const IM=()=>BI.concat(UP);
const DL={b1:['Ingeniero de IA / LLMs','Ingeniero de Machine Learning'],b2:['Arquitecto de software','Arquitecto de Nube'],b3:['Científico de Datos','Ingeniero de Machine Learning'],b4:['Científico de Datos','Ingeniero de IA / LLMs'],b5:['Ingeniero de Nube','Arquitecto de Nube']};
function loadLK(){try{const r=localStorage.getItem('lc_links');if(r)return JSON.parse(r)}catch(e){}
 const o={};for(const k in DL)o[k]=DL[k].map(n=>(ALL.find(c=>c.n===n)||{}).id).filter(Boolean);return o}
let LK=loadLK();
function saveLK(){try{localStorage.setItem('lc_links',JSON.stringify(LK))}catch(e){}}
// IndexedDB para imágenes subidas
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('lc_imgs',1);r.onupgradeneeded=()=>r.result.createObjectStore('i',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const idbDo=(m,a)=>idb().then(d=>new Promise((res,rej)=>{const q=d.transaction('i',m==='getAll'?'readonly':'readwrite').objectStore('i')[m](a);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
idbDo('getAll').then(a=>{UP=a;render()}).catch(()=>{});
function setView(v){view=v;sel=null;render();scrollTo(0,0)}
// Tema
function applyTheme(t){document.documentElement.dataset.theme=t;$('th').textContent=t==='dark'?'☀️ Modo claro':'🌙 Modo oscuro'}
function toggleTheme(){const c=document.documentElement.dataset.theme||'light';const n=c==='dark'?'light':'dark';applyTheme(n);try{localStorage.setItem('lc_theme',n)}catch(e){}}
let th=null;try{th=localStorage.getItem('lc_theme')}catch(e){}
applyTheme(th||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
// Lightbox
function lb(id){const m=IM().find(x=>x.id===id);if(!m)return;$('lbi').src=m.s;$('lbt').textContent=m.t;$('lbx').classList.add('on')}
// Sección de imágenes en cada línea
function imgSec(cid){const L=IM().filter(m=>(LK[m.id]||[]).includes(cid));
 return `<div class="sec"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h2 style="margin:0;flex:1">🖼️ Imágenes relacionadas (${L.length})</h2><button onclick="pickImgs('${cid}')">＋ Relacionar imágenes</button></div>${L.length?`<div class="thumbs">${L.map(m=>`<figure><img src="${m.s}" alt="${h(m.t)}" onclick="lb('${m.id}')"><figcaption>${h(m.t)}</figcaption></figure>`).join('')}</div>`:'<p class="hint" style="margin:8px 0 0">Aún no hay imágenes. Súbelas en la Galería y relaciónalas aquí.</p>'}</div>`}
// Galería
function renderGal(){const A=$('app'),M=IM();
 const L=M.filter(m=>!gf||(gf==='_none'?!(LK[m.id]||[]).some(id=>D.some(c=>c.id===id)):(LK[m.id]||[]).includes(gf)));
 A.innerHTML=`<div class="top"><h2>🖼️ Galería (${M.length})</h2><select style="width:auto;max-width:250px" onchange="gf=this.value;render()"><option value="">Todas las líneas</option><option value="_none"${gf==='_none'?' selected':''}>Sin relacionar</option>${D.map(c=>`<option value="${c.id}"${gf===c.id?' selected':''}>${h(c.n)}</option>`).join('')}</select><button class="p" onclick="$('up').click()">⬆ Subir imágenes</button></div>
 <p class="hint" style="margin-top:-6px">Las imágenes subidas se guardan en este navegador. Relaciónalas con una o varias líneas y aparecerán dentro de cada línea de carrera.</p>
 ${L.length?`<div class="grid">${L.map(m=>`<div class="card gc" style="cursor:default"><img src="${m.s}" alt="${h(m.t)}" onclick="lb('${m.id}')"><h3>${h(m.t)}</h3><div>${(LK[m.id]||[]).map(id=>{const c=D.find(x=>x.id===id);return c?`<span class="tag" style="cursor:pointer" onclick="sel='${c.id}';view='c';render()">${h(c.i)} ${h(c.n)}</span>`:''}).join('')||'<span class="hint">Sin relacionar</span>'}</div><div class="row" style="margin-top:8px"><button onclick="pickCar('${m.id}')">🔗 Relacionar</button>${m.u?`<button onclick="ren('${m.id}')" style="flex:0 0 auto">✏️</button><button class="d" onclick="delImg('${m.id}')" style="flex:0 0 auto">🗑</button>`:''}</div></div>`).join('')}</div>`:'<p class="hint">No hay imágenes en este filtro.</p>'}`}
// Selector de relaciones
function pickCar(id){PK={t:'Relacionar imagen con líneas de carrera',items:D.map(c=>({id:c.id,l:c.i+' '+c.n})),set:new Set(LK[id]||[]),save:()=>{LK[id]=[...PK.set]}};pkOpen()}
function pickImgs(cid){PK={t:'Relacionar imágenes con esta línea',items:IM().map(m=>({id:m.id,l:m.t,s:m.s})),set:new Set(IM().filter(m=>(LK[m.id]||[]).includes(cid)).map(m=>m.id)),save:()=>{IM().forEach(m=>{const a=(LK[m.id]||[]).filter(x=>x!==cid);if(PK.set.has(m.id))a.push(cid);LK[m.id]=a})}};pkOpen()}
function pkOpen(){$('pkt').textContent=PK.t;$('pks').value='';pkRender();$('pk').classList.add('on')}
function pkRender(){const q=$('pks').value.toLowerCase();$('pkl').innerHTML=PK.items.filter(i=>i.l.toLowerCase().includes(q)).map(i=>`<label style="display:flex;gap:10px;align-items:center;padding:6px 4px;cursor:pointer;margin:0;font-size:14px;color:var(--tx)"><input type="checkbox" style="width:auto" ${PK.set.has(i.id)?'checked':''} onchange="pkTog('${i.id}',this.checked)">${i.s?`<img src="${i.s}" alt="" style="width:44px;height:44px;object-fit:cover;object-position:top;border-radius:6px">`:''}${h(i.l)}</label>`).join('')}
function pkTog(id,on){on?PK.set.add(id):PK.set.delete(id)}
function pkClose(){$('pk').classList.remove('on')}
function pkSave(){PK.save();saveLK();pkClose();render()}
// Subida de imágenes
function shrink(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.88))};i.onerror=rej;i.src=u})}
$('up').onchange=async e=>{let warn=false;for(const f of e.target.files){if(!f.type.startsWith('image/'))continue;try{const o={id:'u'+Date.now()+Math.random().toString(36).slice(2,6),t:f.name.replace(/\.[^.]+$/,''),s:await shrink(f),u:1};UP.push(o);try{await idbDo('put',o)}catch(x){warn=true}}catch(x){alert('No se pudo leer '+f.name)}}e.target.value='';if(warn)alert('Tu navegador no permitió guardar las imágenes de forma permanente; solo durarán esta sesión.');render()};
function ren(id){const m=UP.find(x=>x.id===id),t=prompt('Título de la imagen',m.t);if(t&&t.trim()){m.t=t.trim();idbDo('put',m).catch(()=>{});render()}}
async function delImg(id){if(!confirm('¿Eliminar esta imagen?'))return;UP=UP.filter(x=>x.id!==id);delete LK[id];saveLK();try{await idbDo('delete',id)}catch(e){}render()}
render();
</script></body></html>
